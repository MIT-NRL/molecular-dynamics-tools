[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molecular-dynamics-tools"
dynamic = ["version"]
description = "Reusable tools for molecular-dynamics trajectory and structural analysis"
readme = "README.md"
authors = [{name = "Sean Fayfar"}]
keywords = ["molecular dynamics", "trajectory analysis", "RDF", "scattering"]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "MDAnalysis>=2.6",
  "freud-analysis>=3.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "periodictable>=1.6",
  "scipy>=1.10",
  "threadpoolctl>=3.1",
]

[project.optional-dependencies]
cache = ["pyarrow>=14"]
plot = ["matplotlib>=3.7"]
progress = ["tqdm>=4.65"]
test = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
]
dev = [
  "build>=1.0",
  "matplotlib>=3.7",
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.5",
  "tqdm>=4.65",
]

[project.urls]
Repository = "https://github.com/MIT-NRL/molecular-dynamics-tools"
Issues = "https://github.com/MIT-NRL/molecular-dynamics-tools/issues"

[tool.setuptools.dynamic]
version = {attr = "molecular_dynamics_tools.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
molecular_dynamics_tools = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["molecular_dynamics_tools"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
